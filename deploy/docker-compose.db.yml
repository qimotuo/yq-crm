# 仅 PostgreSQL，用法: ./db.sh up

name: yq-crm

networks:
  yqcrm:
    name: yq-crm_net

services:
  db:
    image: postgres:16-alpine
    container_name: yq-crm-db
    restart: unless-stopped
    networks: [yqcrm]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-yqcrm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yqcrm}
      POSTGRES_DB: ${POSTGRES_DB:-yq_crm}
      TZ: Asia/Shanghai
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  pgdata:
