# yq-crm-web 内部 Nginx（外部 Nginx 反代模式，仅 HTTP 80）
# 用变量 + Docker DNS，避免 api 未就绪时 nginx 启动失败
resolver 127.0.0.11 valid=30s ipv6=off;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 20m;

    location /api/ {
        set $api_upstream yq-crm-api:8000;
        proxy_pass http://$api_upstream/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location /docs {
        set $api_upstream yq-crm-api:8000;
        proxy_pass http://$api_upstream/docs;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        set $api_upstream yq-crm-api:8000;
        proxy_pass http://$api_upstream/openapi.json;
        proxy_set_header Host $host;
    }

    location /health {
        set $api_upstream yq-crm-api:8000;
        proxy_pass http://$api_upstream/health;
    }

    location = /crm {
        return 301 /crm/;
    }
    location /crm/ {
        try_files $uri $uri/ /index.html;
    }

    location = /h5 {
        return 301 /h5/;
    }
    location /h5/ {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location /vite.svg {
        try_files $uri =404;
    }
}
