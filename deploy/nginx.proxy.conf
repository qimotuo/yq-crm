upstream yqcrm_web {
    server 127.0.0.1:5173;
    keepalive 32;
}

upstream yqcrm_api {
    server 127.0.0.1:5172;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.qimotuo.cn;
    return 301 https://qimotuo.cn$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name qimotuo.cn;
    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }
    location / {
        return 301 https://qimotuo.cn$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.qimotuo.cn;
    ssl_certificate     /etc/nginx/certs/qimotuo.cn_bundle.pem;
    ssl_certificate_key /etc/nginx/certs/qimotuo.cn.key;
    return 301 https://qimotuo.cn$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name qimotuo.cn;

    ssl_certificate     /etc/nginx/certs/qimotuo.cn_bundle.pem;
    ssl_certificate_key /etc/nginx/certs/qimotuo.cn.key;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 20m;

    location = / {
        root /usr/share/nginx/html/official;
        try_files /index.html =404;
    }

    location /api/ {
        proxy_pass http://yqcrm_api/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location /docs {
        proxy_pass http://yqcrm_api/docs;
        proxy_set_header Host $host;
    }

    location = /crm { return 301 /crm/; }
    location /crm/ {
        proxy_pass http://yqcrm_web/crm/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /h5 { return 301 /h5/; }
    location /h5/ {
        proxy_pass http://yqcrm_web/h5/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        proxy_pass http://yqcrm_web/assets/;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location /vite.svg {
        proxy_pass http://yqcrm_web/vite.svg;
    }

    location / {
        return 404;
    }
}
