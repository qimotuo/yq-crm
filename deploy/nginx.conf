# yq-crm-web 容器内 Nginx（对外 80/443，含 SSL）

upstream yqcrm_api {
    server api:8000;
    keepalive 8;
}

# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name qimotuo.cn www.qimotuo.cn;
    return 301 https://qimotuo.cn$request_uri;
}

# www → 裸域
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.qimotuo.cn;

    ssl_certificate     /etc/nginx/certs/qimotuo.cn_bundle.pem;
    ssl_certificate_key /etc/nginx/certs/qimotuo.cn.key;

    return 301 https://qimotuo.cn$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name qimotuo.cn;

    ssl_certificate     /etc/nginx/certs/qimotuo.cn_bundle.pem;
    ssl_certificate_key /etc/nginx/certs/qimotuo.cn.key;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 20m;
    root /usr/share/nginx/html;
    index index.html;

    # 官网首页
    location = / {
        root /usr/share/nginx/html/official;
        try_files /index.html =404;
    }

    # API
    location /api/ {
        proxy_pass http://yqcrm_api/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location /docs {
        proxy_pass http://yqcrm_api/docs;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://yqcrm_api/openapi.json;
        proxy_set_header Host $host;
    }

    # PC 后台  /crm/
    location = /crm {
        return 301 /crm/;
    }
    location /crm/ {
        try_files $uri $uri/ /index.html;
    }

    # 手机 H5  /h5/
    location = /h5 {
        return 301 /h5/;
    }
    location /h5/ {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        return 404;
    }
}
